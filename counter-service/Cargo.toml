[package]
name = "counter-service"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1.92"
axum = "0.8.9"
chrono = "0.4.45"
deadpool-redis = { version = "0.23.1", features = ["tokio-comp"] }
dotenv = "0.15.0"
fred = { version = "10.1.0", features = ["serde-json"] }
redis = { version = "1.6.0", features = ["tokio-comp"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
