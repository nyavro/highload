 services:
  zabbix-server:
    container_name: messenger-zabbix-server
    image: zabbix/zabbix-server-pgsql:latest
    ports:
      - "10051:10051"
    environment:
      - DB_SERVER_HOST=zabbix-postgres
      - POSTGRES_HOST=zabbix-postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=zabbix
      - POSTGRES_PASSWORD=zabbix
      - ZBX_DBNAME=zabbix
      - ZBX_DBUSER=zabbix
      - ZBX_DBPASSWORD=zabbix
      - ZBX_ENABLE_SNMP_TRAPS=false
    depends_on:
      - zabbix-postgres
    networks:
      - zabbix
      - messenger_backend
    restart: unless-stopped
    
  zabbix-frontend:
    container_name: messenger-zabbix-frontend
    image: zabbix/zabbix-web-nginx-pgsql:latest
    ports:  
      - "8081:8080"
    environment:
      - DB_SERVER_HOST=zabbix-postgres
      - POSTGRES_HOST=zabbix-postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=zabbix
      - POSTGRES_PASSWORD=zabbix
      - ZBX_SERVER_HOST=zabbix-server  
      - ZBX_SERVER_PORT=10051 
    depends_on:
      - zabbix-server
    networks:
      - zabbix
      - messenger_backend
    restart: unless-stopped

  zabbix-agent:
    container_name: messenger-zabbix-agent
    image: zabbix/zabbix-agent:latest
    environment:
      - ZBX_SERVER_HOST=zabbix-server
      - ZBX_HOSTNAME=messenger-zabbix-agent
      - ZBX_PASSIVE_ALLOW=true
      - ZBX_ACTIVE_ALLOW=true
    depends_on:
      - zabbix-server
    networks:
      - zabbix
      - messenger_backend
    restart: unless-stopped
  
  zabbix-postgres:
    container_name: messenger-zabbix-postgres
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=zabbix
      - POSTGRES_PASSWORD=zabbix
      - POSTGRES_DB=zabbix
    ports:
      - "5534:5432"
    volumes:
      - zabbix_pg_data:/var/lib/postgresql/data
    networks:
      - zabbix
      - messenger_backend
    restart: unless-stopped

networks:
  zabbix:
    name: "zabbix_network"
    driver: bridge
  messenger_backend:
    external: true 

volumes:
  zabbix_pg_data: