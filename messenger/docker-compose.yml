services:
  master:
    container_name: "${COMPOSE_PROJECT_NAME:-citus}_master"
    image: 'citusdata/citus:12.1.3'
    ports:
      - "${MASTER_EXTERNAL_PORT:-5532}:5432"
    labels: [ "com.citusdata.role=master" ]
    env_file: .env
    volumes:
      - citus_master_data:/var/lib/postgresql/data
    networks: [ backend ]      
    restart: unless-stopped

  worker:
    image: "citusdata/citus:12.1.3"
    container_name: "${COMPOSE_PROJECT_NAME:-citus}_worker"
    labels: ["com.citusdata.role=Worker"]
    depends_on: [manager]
    env_file: .env
    command: "/wait-for-manager.sh"
    volumes:
      - healthcheck-volume:/healthcheck
    networks: [ backend ]
    restart: unless-stopped

  manager:
    container_name: "${COMPOSE_PROJECT_NAME:-citus}_manager"
    image: "citusdata/membership-manager:0.3.0"
    volumes:
      - "${DOCKER_SOCK:-/var/run/docker.sock}:/var/run/docker.sock"
      - healthcheck-volume:/healthcheck
    depends_on: [master]
    env_file: .env
    networks: [ backend ]
    restart: unless-stopped

  tarantool:
    image: tarantool/tarantool:latest
    container_name: tarantool_db
    ports:
      - "3301:3301"
    env_file: .env
    command: tarantool /opt/tarantool/init.lua
    volumes:
      - ./init/init-in-memory-db.lua:/opt/tarantool/init.lua
      - tarantool_data:/var/lib/tarantool
    networks: [ backend ]
    restart: unless-stopped

  haproxy:
    image: haproxy:latest
    container_name: messenger-haproxy
    ports:
      - "5432:5432"
      - "5433:5433"
      - "8404:8404"
    volumes:
      - ./config/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    depends_on:
      - master
      - worker
    networks: [ backend ]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "haproxy", "-c", "-f", "/usr/local/etc/haproxy/haproxy.cfg"]
      interval: 10s
      timeout: 5s
      retries: 3

  messenger_1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: messenger_1
    ports:
      - "3001:3000"
    environment:
      - APPLICATION_PORT=3000
      - db_postgres_host=messenger-haproxy
      - db_postgres_master_port=5432
      - db_postgres_replica_port=5433
    depends_on:
      - haproxy
      - tarantool    
    networks: [ backend, frontend ]
    restart: unless-stopped

  messenger_2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: messenger_2
    ports:
      - "3002:3000"
    environment:
      - APPLICATION_PORT=3000
      - db_postgres_host=messenger-haproxy
      - db_postgres_master_port=5432
      - db_postgres_replica_port=5433
    depends_on:
      - haproxy
      - tarantool    
    networks: [ backend, frontend ]
    restart: unless-stopped

  messenger_3:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: messenger_3
    ports:
      - "3003:3000"
    environment:
      - APPLICATION_PORT=3000
      - db_postgres_host=messenger-haproxy
      - db_postgres_master_port=5432
      - db_postgres_replica_port=5433
    depends_on:
      - haproxy
      - tarantool    
    networks: [ backend, frontend ]
    restart: unless-stopped

  nginx:
    image: nginx:1.25-alpine
    container_name: messenger-nginx
    ports: 
      - "80:80"
    volumes:
      - ./config/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - messenger_1
      - messenger_2
      - messenger_3
    networks: [ frontend ]
    restart: unless-stopped

networks:
  backend:
    name: "messenger_backend"
    driver: bridge
  frontend:
    name: "messenger_frontend"
    driver: bridge

volumes:
  healthcheck-volume:
  citus_master_data:  
  tarantool_data:  