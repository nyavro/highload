groups: 
  - name: messenger_alerts
    rules:
      - alert: HighErrorRate
        expr: sum(rate(errors_total[5m])) / sum(rate(requests_total[5m])) > 0.05
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "High HTTP error rate"
          description: "High HTTP error rate > 5% in 2 minutes (now {{ $value | humanizePercentage }})"
      
      - alert: MessengerDown
        expr: up{job="messenger"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Messenger is down"
          description: "Instance {{ $labels.instance }} not reachable for more than a minute"