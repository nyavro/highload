user nginx;
worker_processes auto;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include     /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '                    
                    'rt=$request_time uct=$upstream_connect_time '                    
                    'uht=$upstream_header_time urt=$upstream_response_time';

    access_log  /var/log/nginx/access.log main;

    sendfile    on;
    tcp_nopush  on;
    tcp_nodelay on;

    keepalive_timeout   65;
    keepalive_requests  100;

    resolver 127.0.0.11 valid=10s ipv6=off;

    upstream messenger_backend {
        least_conn;
        server messenger_1:3000 max_faults=3 fail_timeout=30s;
        server messenger_2:3000 max_faults=3 fail_timeout=30s;
        server messenger_3:3000 max_faults=3 fail_timeout=30s;
    }

    server {
        listen 80;
        server_name messenger.local;

        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;

        proxy_connect_timeout   5s;
        proxy_send_timeout      10s;
        proxy_read_timeout      30s;

        client_body_buffer_size 128k;
        client_max_body_size    1m;

        location /health {
            proxy_pass http://messenger_backend;
            proxy_net_upstream error timeout invalid_header http_500 http_503;
            acess_log off;
        }

        location / {
            proxy_pass http://messenger_backend;
            proxy_net_upstream error timeout invalid_header http_500 http_503;
            proxy_net_upstream_tries 3;
            proxy_net_upstream_timeout 10s;
        }

        location /login {
            proxy_pass http://messenger_backend;
            proxy_net_upstream error timeout invalid_header http_500;            
        }
    }
}