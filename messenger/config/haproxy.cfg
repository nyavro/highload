global
    stats socket /tmp/api.sock user haproxy group haproxy mode 660 level admin expose-fd listeners
    log stdout format raw local0
    maxconn 4096

defaults
    mode tcp
    timeout connect 10s
    timeout client  60s
    timeout server  60s
    timeout check   5s
    retries 3
    log global

frontend pg_master_front
    bind *:5432
    default_backend pg_master

backend pg_master
    mode tcp
    option tcp-check
    tcp-check connect
    tcp-check send SELECT 1\r
    tcp-check expect string OK
    balance roundrobin
    server master citus_master 5432 check inter 5s fall 3 rise 2 

frontend pg_replica_front
    bind *:5433
    default_backend pg_replicas

backend pg_replicas
    mode tcp
    option tcp-check
    tcp-check connect
    tcp-check send SELECT 1\r
    tcp-check expect string OK
    balance roundrobin
    server worker1 citus_worker_1 5432 check inter 5s fall 3 rise 2 
    server worker2 citus_worker_2 5432 check inter 5s fall 3 rise 2 
    server worker3 citus_worker_3 5432 check inter 5s fall 3 rise 2 

frontend stats
    bind *:8404
    mode http
    stats enable
    stats uri /stats
    stats refresh 10s
    stats auth admin:admin123
